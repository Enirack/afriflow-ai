services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: afriflow
      POSTGRES_USER: afriflow
      POSTGRES_PASSWORD: afriflow
    ports:
      - "5433:5432"
    volumes:
      - afriflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afriflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/backend/Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://afriflow:afriflow@database:5432/afriflow?serverVersion=16&charset=utf8
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "4200:4200"
    command: sh -c "npm install && npm start -- --host 0.0.0.0"
    depends_on:
      - backend

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - database

volumes:
  afriflow_db:
