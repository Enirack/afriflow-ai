name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: afriflow_test
          POSTGRES_USER: afriflow
          POSTGRES_PASSWORD: afriflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afriflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, zip

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check container is valid
        run: php bin/console lint:container

      - name: Generate JWT keypair
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction

      - name: Run migrations
        env:
          APP_ENV: test
          # No "_test" here: Doctrine's dbname_suffix (config/packages/doctrine.yaml,
          # when@test) appends it automatically, matching the "afriflow_test"
          # database the postgres service above actually creates.
          DATABASE_URL: postgresql://afriflow:afriflow@127.0.0.1:5432/afriflow?serverVersion=16&charset=utf8
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run tests
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://afriflow:afriflow@127.0.0.1:5432/afriflow?serverVersion=16&charset=utf8
        run: php bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
